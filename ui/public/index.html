<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOP Control Center</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#edf2f7;background:#0b0e12}*{box-sizing:border-box}body{margin:0;background:#0b0e12}.wrap{max-width:1240px;margin:auto;padding:20px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:18px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#8b949e}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.panel,.card{background:#141920;border:1px solid #27303a;border-radius:14px;padding:16px}.health{font-size:52px;font-weight:800;line-height:1}.statusline{font-size:20px;font-weight:700;margin:8px 0}.muted{color:#8b949e}.ok{color:#7ee787}.warn{color:#e3b341}.bad{color:#ff7b72}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;background:#202731;border:1px solid #303a46}.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{font-size:26px;font-weight:750;margin-top:4px}.item{padding:10px 0;border-top:1px solid #26303a}.item:first-child{border-top:0}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-word}.job{white-space:pre-wrap;background:#0b0e12;padding:10px;border-radius:8px;max-height:220px;overflow:auto}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scroll{max-height:320px;overflow:auto}button{background:#202731;color:#fff;border:1px solid #354150;border-radius:8px;padding:8px 11px;cursor:pointer}details{border-top:1px solid #26303a;padding:10px 0}summary{cursor:pointer;font-weight:700}.empty{color:#8b949e;padding:8px 0}@media(max-width:850px){.hero,.grid,.details{grid-template-columns:1fr}.wrap{padding:14px}.health{font-size:44px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="eyebrow">FLOP operator surface</div><h1 style="margin:4px 0 0">Control Center</h1><div id="mode" class="muted"></div></div><button onclick="load()">Refresh</button></div>
<div class="hero"><div class="panel"><div class="eyebrow">Overall state</div><div class="row" style="align-items:flex-end"><div><div id="score" class="health">--</div><div id="headline" class="statusline">Loading</div><div id="summary" class="muted"></div></div><div id="overallPill"></div></div></div>
<div class="panel"><div class="eyebrow">Needs attention</div><div id="attention"></div></div></div>
<div class="section"><h2>What changed</h2><div id="changed" class="panel"></div></div>
<div class="section"><h2>Adoption & integrate</h2><div id="adoption" class="panel"></div></div>
<div class="section grid"><div class="card"><div class="eyebrow">Continuity</div><div id="continuityMetric" class="metric">--</div><div id="continuity"></div></div><div class="card"><div class="eyebrow">Conformance handoff</div><div id="handoffMetric" class="metric">--</div><div id="handoff"></div></div><div class="card"><div class="eyebrow">Evidence</div><div id="evidenceMetric" class="metric">--</div><div id="evidence"></div></div></div>
<div class="section details"><div class="card"><h2>Runtime & network</h2><div id="runtime"></div></div><div class="card"><h2>Repositories</h2><div id="repos"></div></div></div>
<div class="section card"><h2>Technical detail</h2><details><summary>Trust boundaries</summary><div id="trust"></div></details><details><summary>Peer evidence</summary><div id="peers"></div></details><details><summary>GitHub / upstream</summary><div id="github"></div></details><details><summary>Recent logs</summary><div id="logs" class="scroll"></div></details><details><summary>Checks / jobs</summary><div id="jobs"></div></details></div>
<script>
let state={};const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const pill=(t,c='')=>`<span class="pill ${c}">${esc(t)}</span>`;const empty=t=>`<div class="empty">${esc(t)}</div>`;
async function load(){try{state=await(await fetch('/api/status')).json();render()}catch(e){headline.textContent='Status unavailable';headline.className='statusline bad';summary.textContent=String(e)}}
function render(){const health=state.health_score??0;const alerts=state.alerts||[];const badAlerts=alerts.filter(a=>a.level==='bad');const warnAlerts=alerts.filter(a=>a.level==='warn');mode.textContent=state.demo?'Demo mode · synthetic data · read-only':'Public-safe operator surface';score.textContent=health+'/100';score.className='health '+(health>85?'ok':health>65?'warn':'bad');headline.textContent=badAlerts.length?'Action required':warnAlerts.length?'Attention needed':'Stack looks healthy';headline.className='statusline '+(badAlerts.length?'bad':warnAlerts.length?'warn':'ok');summary.textContent=`${badAlerts.length} critical · ${warnAlerts.length} warning · ${(state.repos||[]).length} repos · ${(state.tasks||[]).length} runtime tasks`;overallPill.innerHTML=pill(badAlerts.length?'DEGRADED':warnAlerts.length?'WATCH':'HEALTHY',badAlerts.length?'bad':warnAlerts.length?'warn':'ok');
attention.innerHTML=alerts.length?alerts.slice(0,5).map(a=>`<div class="item ${a.level}">${esc(a.text)}</div>`).join(''):'<div class="item ok">No active alerts</div>';
const ad=state.adoption||{};
adoption.innerHTML=`<div class=item><div class=row><div><b>${esc(ad.goal||'External adoption')}</b><div class=muted>${esc(ad.rule||'')}</div></div>${pill((ad.verified_external_ci??0)+' verified external CI',(ad.verified_external_ci??0)>0?'ok':'warn')}</div><div style="margin-top:10px">${(ad.profiles||[]).map(p=>`<div class=item><b>${esc(p.name)}</b><div class=muted>${esc(p.use)}</div></div>`).join('')}</div><div class=row style="margin-top:10px"><a href="${esc(ad.quickstart||'#')}" target=_blank>60-second integration</a><a href="${esc(ad.matrix||'#')}" target=_blank>Adoption matrix</a></div></div>`;
const dh=state.drift_handoff||{};const handoffs=dh.handoffs||[];const pending=handoffs.filter(x=>x.reproduction?.status==='PENDING'||x.currentResult==='UNKNOWN');changed.innerHTML=handoffs.length?handoffs.slice(0,6).map(x=>`<div class=item><div class=row><div><b>${esc(x.change||x.sourceId||'drift')}</b><div class=muted>${esc((x.affected||[]).join(', '))}</div></div>${pill(x.reproduction?.status||x.currentResult||'UNKNOWN',(x.reproduction?.status==='PASS')?'ok':(x.reproduction?.status==='FAIL')?'bad':'warn')}</div></div>`).join(''):empty('No drift handoff events observed.');
const cp=state.continuity_proof||{};continuityMetric.textContent=cp.duty_cycle_pct==null?'Unknown':cp.duty_cycle_pct+'%';continuityMetric.className='metric '+(cp.state==='observed'?'ok':cp.state==='unknown'?'muted':'warn');continuity.innerHTML=`<div class=item><div class=row><span>State</span>${pill(cp.state||'unknown',cp.state==='observed'?'ok':cp.state==='unknown'?'muted':'warn')}</div><div class=row><span>Cycles</span><b>${esc(cp.delivered_cycles??0)} / ${esc(cp.expected_cycles??0)}</b></div><div class=row><span>Worst gap</span><span>${cp.worst_gap_seconds==null?'—':esc(cp.worst_gap_seconds)+' s'}</span></div><div class=row><span>Freshness</span><span>${cp.freshness_seconds==null?'—':esc(cp.freshness_seconds)+' s'}</span></div></div>`;
handoffMetric.textContent=pending.length?pending.length+' pending':'Clear';handoffMetric.className='metric '+(pending.length?'warn':'ok');handoff.innerHTML=dh.state==='invalid'?`<div class=item bad>${esc(dh.error||'Invalid handoff')}</div>`:handoffs.length?`<div class=item><div class=row><span>Total events</span><b>${handoffs.length}</b></div><div class=row><span>Pending reproduction</span><b>${pending.length}</b></div></div>`:empty('No active handoff.');
const reg=state.evidence_registry||{};const records=reg.records||[];evidenceMetric.textContent=records.length+' records';evidence.innerHTML=`<div class=item><div class=row><span>Accepted</span><b>${records.length}</b></div><div class=row><span>Rejected</span><b>${(reg.rejected||[]).length}</b></div></div>`;
const net=Object.entries(state.network||{});const tasks=state.tasks||[];runtime.innerHTML=`<div class=item><b>Network</b>${net.map(([k,v])=>`<div class=row><span>${esc(k)}</span>${pill(v.ok?(v.ms!=null?v.ms+' ms':'online'):'down',v.ok?'ok':'bad')}</div>`).join('')||empty('No network targets.')}</div><div class=item><b>Tasks</b>${tasks.map(x=>`<div class=row><span>${esc(x.TaskName)}</span><span>${pill(x.State,x.State==='Running'?'ok':'warn')} ${state.demo?'':`<button onclick="task('${esc(x.TaskName)}','start')">Start</button> <button onclick="task('${esc(x.TaskName)}','stop')">Stop</button>`}</span></div>`).join('')||empty('No tasks configured.')}</div>`;
repos.innerHTML=(state.repos||[]).map(x=>`<div class=item><div class=row><div><b>${esc(x.name)}</b><div class=muted>${esc(x.branch||'-')} · ${esc(x.head||'-')}</div></div>${pill(x.git?(x.dirty?'dirty':'clean'):'no git',x.dirty?'warn':'ok')}</div><div class=muted>${esc(x.last||'')}${x.ahead!=null?` · ahead ${x.ahead} / behind ${x.behind}`:''}</div>${state.demo?'':`<div style="margin-top:8px"><button onclick="checkRepo('${esc(x.name)}')">Run check</button> <button onclick="openRepo('${esc(x.name)}')">Open folder</button></div>`}</div>`).join('')||empty('No repositories configured.');
trust.innerHTML=Object.entries(state.trust_boundaries||{}).map(([k,v])=>{const p=v.policy||{};const blocked=p.allow_settlement_claim===false;return `<div class=item><div class=row><b>${esc(k)}</b>${pill(blocked?'claim blocked':'eligible',blocked?'warn':'ok')}</div><div>${pill(p.status||'unknown')} ${pill(v.classification||'')}</div><div class=muted>${esc(v.display_rule||p.reason||'')}</div></div>`}).join('')||empty('No active trust boundaries.');
peers.innerHTML=(state.peer_evidence?.records||[]).map(p=>`<div class=item><div class=row><b>${esc(p.source||p.project||'peer')}</b>${pill(p.verification_state||'reported','warn')}</div><div class=muted>${esc(p.summary||'')}</div></div>`).join('')||(state.peer_acknowledgements||[]).map(p=>`<div class=item><b>${esc(p.project)}</b><div class=muted>${esc(p.author)} · ${esc(p.applied_as)}</div></div>`).join('')||empty('Peer evidence disabled or unavailable.');
github.innerHTML=Object.entries(state.github||{}).map(([k,v])=>`<div class=item><div class=row><b>${esc(k)}</b>${pill(v.ok?'online':'error',v.ok?'ok':'bad')}</div><div>${esc(v.name||'')}</div><div class=muted>${esc(v.updated_at||'')}${v.ms!=null?' · '+esc(v.ms)+' ms':''}</div></div>`).join('')||empty('No GitHub targets configured.');
logs.innerHTML=(state.logs||[]).map(x=>`<div class=item><b>${esc(x.path)}</b><div class="job mono">${esc(x.tail)}</div></div>`).join('')||empty('No recent logs.');renderJobs()}
function renderJobs(){jobs.innerHTML='';const entries=Object.entries(state.jobs||{}).reverse();if(!entries.length){jobs.innerHTML=empty('No jobs yet.');return}entries.forEach(([,x])=>jobs.innerHTML+=`<div class=item><div class=row><b>${esc(x.repo)}</b>${pill(x.state,x.state==='passed'?'ok':x.state==='failed'?'bad':'warn')}</div>${x.output?`<div class="job mono">${esc(x.output)}</div>`:''}</div>`)}
async function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}
async function checkRepo(repo){await post('/api/check',{repo});setTimeout(load,700)}
async function openRepo(repo){await post('/api/open',{repo})}
async function task(task,action){if(!confirm(`${action} ${task}?`))return;await post('/api/task',{task,action});setTimeout(load,700)}
setInterval(load,15000);load();
</script></div></body></html>
