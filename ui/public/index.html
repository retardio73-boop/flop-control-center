<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOP Control Center</title>
<style>
body{font-family:Arial,sans-serif;background:#0d1014;color:#e8edf2;margin:0;padding:18px}.wrap{max-width:1320px;margin:auto}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#161a20;border:1px solid #2a313b;border-radius:12px;padding:15px}.ok{color:#7ee787}.bad{color:#ff7b72}.warn{color:#e3b341}.muted{color:#8b949e}.pill{border-radius:999px;padding:3px 8px;font-size:12px;background:#252b36}.section{margin-top:16px}.repo,.item{border-top:1px solid #2a313b;padding-top:9px;margin-top:9px}.mono{font-family:monospace;font-size:12px;word-break:break-all}button{background:#252b36;color:#fff;border:1px solid #3a4352;border-radius:8px;padding:7px 10px;cursor:pointer}.score{font-size:42px;font-weight:700}.scroll{max-height:330px;overflow:auto}.job{white-space:pre-wrap;background:#0b0d11;padding:10px;border-radius:8px;max-height:250px;overflow:auto;font-family:monospace;font-size:12px}h1,h2,h3{margin-top:0}</style></head>
<body><div class="wrap"><div class="top"><div><h1>FLOP Control Center</h1><div id="mode" class="muted">Public-safe operator surface</div></div><button onclick="load()">Refresh</button></div>
<div class="section grid"><div class="card"><h3>Health</h3><div id="score" class="score">--</div><div id="alerts"></div></div><div class="card"><h3>Network</h3><div id="network"></div></div><div class="card"><h3>Runtime tasks</h3><div id="tasks"></div></div><div class="card"><h3>GitHub / upstream</h3><div id="github"></div></div><div class="card"><h3>Evidence trust</h3><div id="trust"></div></div><div class="card"><h3>Autonomy evidence</h3><div id="autonomy"></div></div><div class="card"><h3>Peer learnings</h3><div id="peers"></div></div></div>
<div class="section card"><h3>Repositories</h3><div id="repos"></div></div><div class="section grid"><div class="card"><h3>Recent logs</h3><div id="logs" class="scroll"></div></div><div class="card"><h3>Checks / jobs</h3><div id="jobs"></div></div></div>
<script>
let state={};const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const pill=(t,c='')=>`<span class="pill ${c}">${esc(t)}</span>`;
async function load(){try{state=await(await fetch('/api/status')).json();render()}catch(e){document.body.dataset.error=String(e)}}
function render(){mode.textContent=state.demo?'Demo mode · synthetic data · read-only':'Public-safe operator surface';score.textContent=(state.health_score??0)+'/100';score.className='score '+(state.health_score>85?'ok':state.health_score>65?'warn':'bad');alerts.innerHTML=(state.alerts||[]).length?(state.alerts||[]).map(a=>`<div class="item ${a.level}">${esc(a.text)}</div>`).join(''):'<div class="ok">No active alerts</div>';
network.innerHTML=Object.entries(state.network||{}).map(([k,v])=>`<div class=row><b>${esc(k)}</b>${pill(v.ok?`${v.ms} ms`:'down',v.ok?'ok':'bad')}</div>`).join('')||'<span class=muted>No targets configured.</span>';
tasks.innerHTML=(state.tasks||[]).map(x=>`<div class=item><div class=row><b>${esc(x.TaskName)}</b>${pill(x.State,x.State==='Running'?'ok':'warn')}</div>${state.demo?'':`<button onclick="task('${esc(x.TaskName)}','start')">Start</button> <button onclick="task('${esc(x.TaskName)}','stop')">Stop</button>`}</div>`).join('')||'<span class=muted>No tasks configured.</span>';
github.innerHTML=Object.entries(state.github||{}).map(([k,v])=>`<div class=item><div class=row><b>${esc(k)}</b>${pill(v.ok?'online':'error',v.ok?'ok':'bad')}</div><div>${esc(v.name||'')}</div><div class=muted>${esc(v.updated_at||'')} ${v.ms!=null?'· '+esc(v.ms)+' ms':''}</div></div>`).join('')||'<span class=muted>No GitHub targets configured.</span>';
autonomy.innerHTML=(state.autonomy_evidence?.signals||[]).map(s=>`<div class=item><div class=row><b>${esc(s.name)}</b>${pill(s.state,s.state==='observed'?'ok':s.state==='unknown'?'muted':'warn')}</div><div class=muted>${esc(s.detail)}</div></div>`).join('')+`<div class='item muted'>${esc(state.autonomy_evidence?.claim||'')}</div>`; peers.innerHTML=(state.peer_acknowledgements||[]).map(p=>`<div class=item><b>${esc(p.project)}</b> <span class=muted>â€” ${esc(p.author)}</span><div>${esc(p.applied_as)}</div></div>`).join('')||'<span class=muted>No peer acknowledgements.</span>';
trust.innerHTML=Object.entries(state.trust_boundaries||{}).map(([k,v])=>{const p=v.policy||{};const blocked=p.allow_settlement_claim===false;return `<div class=item><div class=row><b>${esc(k)}</b>${pill(blocked?'SETTLEMENT CLAIM BLOCKED':'eligible',blocked?'bad':'ok')}</div><div>${pill(p.status||'unknown',blocked?'warn':'ok')} ${pill(v.classification||'')}</div><div class=muted style="margin-top:6px">${esc(v.display_rule||p.reason||'')}</div></div>`}).join('')||'<span class=muted>No active evidence trust boundaries.</span>';
repos.innerHTML=(state.repos||[]).map(x=>`<div class=repo><div class=row><div><b>${esc(x.name)}</b><div class=muted>${esc(x.branch||'-')} · ${esc(x.head||'-')}</div></div>${pill(x.git?(x.dirty?'dirty':'clean'):'no git',x.dirty?'warn':'ok')}</div><div class=muted>${esc(x.last||'')}${x.ahead!=null?` · ahead ${x.ahead} / behind ${x.behind}`:''}</div>${state.demo?'':`<div style="margin-top:8px"><button onclick="checkRepo('${esc(x.name)}')">Run check</button> <button onclick="openRepo('${esc(x.name)}')">Open folder</button></div>`}</div>`).join('');
logs.innerHTML=(state.logs||[]).map(x=>`<div class=item><b>${esc(x.path)}</b><div class=job>${esc(x.tail)}</div></div>`).join('')||'<span class=muted>No recent logs.</span>';renderJobs()}
function renderJobs(){jobs.innerHTML='';const entries=Object.entries(state.jobs||{}).reverse();if(!entries.length)jobs.innerHTML='<span class=muted>No jobs yet.</span>';entries.forEach(([,x])=>jobs.innerHTML+=`<div class=repo><div class=row><b>${esc(x.repo)}</b>${pill(x.state,x.state==='passed'?'ok':x.state==='failed'?'bad':'warn')}</div>${x.output?`<div class=job>${esc(x.output)}</div>`:''}</div>`)}
async function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}async function checkRepo(repo){await post('/api/check',{repo});setTimeout(load,700)}async function openRepo(repo){await post('/api/open',{repo})}async function task(task,action){if(!confirm(`${action} ${task}?`))return;await post('/api/task',{task,action});setTimeout(load,700)}setInterval(load,15000);load();
</script></div></body></html>
