name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q .
      - name: Demo server smoke
        run: python tools/smoke_demo.py
      - name: Public snapshot smoke
        run: >-
          python -c "import shutil; shutil.copyfile('config/config.example.json','config/config.local.json'); from core.config import load_config; from core.public_snapshot import build; d=build(load_config()); assert d['mode']=='public-safe'; print(d['health_score'])"
